<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MDM">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<title>MDM</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  overflow: hidden; background: #000;
}
#stage {
  position: fixed; inset: 0;
  width: 100vw; height: 100dvh;
  overflow: hidden; background: #66c94d;
}
#art {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: fill; display: block;
}
.overlay {
  position: absolute; left: 0; width: 100%;
  display: flex; align-items: center; justify-content: center;
  color: #000; white-space: nowrap; text-align: center;
  font-family: Arial, -apple-system, BlinkMacSystemFont, sans-serif;
  font-variant-numeric: tabular-nums;
}
#clock {
  top: 52.8%; height: 4.6%;
  font-size: 8.1vw; font-weight: 800;
  letter-spacing: -0.045em;
}
#lockTime {
  top: 88.35%; height: 3.2%;
  font-size: 4.45vw; font-weight: 400;
  letter-spacing: -0.025em;
}
@media (min-width: 600px) {
  #clock { font-size: 48px; }
  #lockTime { font-size: 27px; }
}
</style>
</head>
<body>
<div id="stage">
  <img id="art" src="./mdm-original-interface.jpg" alt="">
  <div id="clock" class="overlay">115/11/09 19:39:54</div>
  <div id="lockTime" class="overlay">上鎖時間：115/11/09 06:50:45</div>
</div>
<script>
function rocDateTime(date) {
  const y = date.getFullYear() - 1911;
  const mm = String(date.getMonth() + 1).padStart(2, '0');
  const dd = String(date.getDate()).padStart(2, '0');
  const hh = String(date.getHours()).padStart(2, '0');
  const mi = String(date.getMinutes()).padStart(2, '0');
  const ss = String(date.getSeconds()).padStart(2, '0');
  return {
    date: `${y}/${mm}/${dd}`,
    full: `${y}/${mm}/${dd} ${hh}:${mi}:${ss}`
  };
}
function updateTime() {
  const now = new Date();
  const value = rocDateTime(now);
  document.getElementById('clock').textContent = value.full;
  document.getElementById('lockTime').textContent =
    `上鎖時間：${value.date} 06:50:45`;
}
updateTime();
setInterval(updateTime, 250);
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
